<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FLN Rating | CS2 Stats</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1d; color: #e0e0e0; padding: 20px; }
        h1 { color: #ff4d4d; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .match-card {
            background: #2b2b36; border-left: 4px solid #ff4d4d; padding: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; border-radius: 8px;
        }
        .team-name { font-weight: bold; font-size: 1.1rem; }
        .score { font-size: 1.3rem; font-weight: bold; color: #fff; }
        .tournament { font-size: 0.8rem; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>FLN Rating</h1>
    <p>Live-матчи CS2 • Fuluny Corporation</p>
    
    <div id="live-matches"></div>

    <script>
        async function loadLiveMatches() {
            try {
                // Запрос к API
                const response = await fetch('https://api.cs2-api.org/v1/matches?status=live');
                const data = await response.json();
                const container = document.getElementById('live-matches');
                
                if (!data.matches || data.matches.length === 0) {
                    container.innerHTML = '<p>Сейчас нет живых матчей 😴</p>';
                    return;
                }

                let html = '';
                data.matches.forEach(match => {
                    html += `
                        <div class="match-card">
                            <div class="team-name">${match.team1.name}</div>
                            <div class="score">${match.score1} : ${match.score2}</div>
                            <div class="team-name" style="text-align: right;">${match.team2.name}</div>
                        </div>
                        <div class="tournament">${match.tournament.name}</div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                console.error('Ошибка загрузки матчей:', error);
                document.getElementById('live-matches').innerHTML = '<p style="color: #ff4d4d;">Не удалось загрузить данные. Попробуй позже.</p>';
            }
        }

        loadLiveMatches();
    </script>
</body>
</html>
