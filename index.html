<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FLN Rating | Hub</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        :root { --accent: #ff4d4d; --dark: #0f0f12; --card: #1a1a1d; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 20px; }
        
        /* Навигация-табы */
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 1px solid #2b2b36; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #666; font-size: 1rem; cursor: pointer; padding: 8px 16px; border-radius: 4px; transition: 0.2s; }
        .tab-btn.active { background: rgba(255, 77, 77, 0.15); color: var(--accent); }
        
        /* Контейнеры */
        #tab-live, #tab-rating, #tab-transfers { display: none; animation: fadeIn 0.4s ease; }
        #tab-live.active, #tab-rating.active, #tab-transfers.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { color: var(--accent); margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Live матчи */
        .match-card { background: var(--card); border-left: 4px solid var(--accent); padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; }
        .team-name { font-weight: bold; font-size: 1.1rem; }
        .score { font-size: 1.4rem; font-weight: bold; color: white; }
        .tournament { font-size: 0.8rem; color: #888; margin-top: 4px; }

        /* Рейтинги */
        .ranking-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .ranking-container { grid-template-columns: 1fr; } }
        
        .rank-block { background: var(--card); padding: 15px; border-radius: 8px; }
        .rank-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-official { background: #2b2b36; color: #aaa; }
        .badge-fuluny { background: #ff4d4d; color: white; }

        .row { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #25252b; }
        .col-rank { width: 50px; color: #666; }
        .col-team { flex: 1; font-weight: 600; }
        .col-reason { font-size: 0.9rem; color: #aaa; margin-left: 15px; flex: 1; }

        /* Трансферы */
        .news-grid { display: grid; gap: 15px; }
        .news-card { background: var(--card); padding: 15px; border-radius: 8px; border-left: 4px solid transparent; }
        .status-confirmed { border-left-color: #4caf50; }
        .status-rumor { border-left-color: #ff9800; }
        .news-date { font-size: 0.8rem; color: #888; display: block; margin-bottom: 5px; }
        .news-title { font-weight: bold; margin-bottom: 5px; color: white; }
        .news-desc { color: #ccc; line-height: 1.5; }

        .loading { text-align: center; color: #666; padding: 40px; }
    </style>
</head>
<body>

    <!-- Навигация -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('live')">Live Матчи</button>
        <button class="tab-btn" onclick="switchTab('rating')">Рейтинг</button>
        <button class="tab-btn" onclick="switchTab('transfers')">Трансферы & Слухи</button>
    </div>

    <!-- Вкладка LIVE -->
    <div id="tab-live" class="active">
        <h2>Текущие матчи</h2>
        <p style="color: #666;">Статус игр в реальном времени.</p>
        <div id="live-matches"></div>
    </div>

    <!-- Вкладка РЕЙТИНГ -->
    <div id="tab-rating">
        <h2>Сила команд</h2>
        <div class="ranking-container">
            <!-- Официальный VRS -->
            <div class="rank-block">
                <div class="rank-header">
                    <span>Valve Regional Standings (API)</span>
                    <span class="badge badge-official">OFFICIAL</span>
                </div>
                <div id="vrs-official"></div>
            </div>
            <!-- Fuluny Power Ranking -->
            <div class="rank-block">
                <div class="rank-header">
                    <span>Fuluny Power Ranking (Ручной)</span>
                    <span class="badge badge-fuluny">FULUNY</span>
                </div>
                <div id="vrs-fuluny"></div>
            </div>
        </div>
    </div>

    <!-- Вкладка ТРАНСФЕРЫ -->
    <div id="tab-transfers">
        <h2>Трансферы и слухи</h2>
        <div class="news-grid" id="transfers-list"></div>
    </div>

    <script>
        // --- ЛОГИКА ПЕРЕКЛЮЧЕНИЯ ВКЛАДОК ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('[id^="tab-"]').forEach(d => d.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // --- ЗАГРУЗКА LIVE МАТЧЕЙ (Твой старый код) ---
        async function loadLive() {
            // ВСТАВЬ СЮДА СВОЙ КЛЮЧ И АДРЕС WORKER
            const apiUrl = 'https://твой-воркер.workers.dev/api/v1/cs2/live'; 
            const key = 'npx cito-mcp install --key cito_894e0c5905e16e53652469883032a3f04c9c337a33caee882204500599074da9';
            
            try {
                const res = await fetch(apiUrl, { headers: { 'x-api-key': key } });
                const data = await res.json();
                const container = document.getElementById('live-matches');
                
                if (!data.data || data.data.length === 0) {
                    container.innerHTML = '<p style="color:#888">Сейчас нет живых матчей 😴</p>';
                    return;
                }

                data.data.forEach(match => {
                    const html = `
                        <div class="match-card">
                            <div>
                                <div class="team-name">${match.team1_name}</div>
                                <div class="tournament">${match.tournament_name || 'Турнир'}</div>
                            </div>
                            <div class="score">${match.score_team1} : ${match.score_team2}</div>
                            <div style="text-align:right">
                                <div class="team-name">${match.team2_name}</div>
                                <div class="tournament">Live • ${match.map_name}</div>
                            </div>
                        </div>`;
                    container.innerHTML += html;
                });
            } catch (e) { console.error(e); }
        }

        // --- ЗАГРУЗКА ДАННЫХ ИЗ data.json (ТВОЙ КОНТЕНТ) ---
        async function loadData() {
            try {
                // Берем JSON из того же места, где лежит html
                const response = await fetch('data.json');
                const json = await response.json();

                // Рендер Fuluny Ranking
                const fulunyContainer = document.getElementById('vrs-fuluny');
                fulunyContainer.innerHTML = json.power_ranking.map((t, i) => `
                    <div class="row">
                        <div class="col-rank">#${t.rank}</div>
                        <div class="col-team">${t.team}</div>
                        <div class="col-reason">${t.reason}</div>
                    </div>
                `).join('');

                // Рендер Трансферов
                const transfersContainer = document.getElementById('transfers-list');
                transfersContainer.innerHTML = json.transfers.map(t => `
                    <div class="news-card status-${t.status}">
                        <span class="news-date">${t.date}</span>
                        <span class="news-title">${t.title}</span>
                        <p class="news-desc">${t.description}</p>
                    </div>
                `).join('');

            } catch (e) {
                console.error('Ошибка загрузки data.json', e);
                document.getElementById('transfers-list').innerHTML = '<div class="loading">Не удалось загрузить новости</div>';
            }
        }

        // --- ЗАГРУЗКА ОФИЦИАЛЬНОГО РЕЙТИНГА (API) ---
        async function loadOfficialRanking() {
            const key = 'npx cito-mcp install --key cito_894e0c5905e16e53652469883032a3f04c9c337a33caee882204500599074da9';
            try {
                const res = await fetch('https://api.citoapi.com/api/v1/cs2/rankings/vrs?limit=5', {
                    headers: { 'x-api-key': key }
                });
                const data = await res.json();
                const container = document.getElementById('vrs-official');
                
                container.innerHTML = data.data.slice(0, 5).map(r => `
                    <div class="row">
                        <div class="col-rank">#${r.rank}</div>
                        <div class="col-team">${r.teamName}</div>
                        <div class="col-reason" style="color:#ff4d4d">${r.points} очков</div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
                document.getElementById('vrs-official').innerHTML = '<div class="loading">Ошибка API</div>';
            }
        }

        // Запуск всех функций при загрузке
        window.onload = () => {
            loadLive();
            loadData();
            loadOfficialRanking();
        };
    </script>
</body>
</html>
